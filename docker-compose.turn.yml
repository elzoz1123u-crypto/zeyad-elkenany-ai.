services:
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command: >-
      -n --log-file=stdout --fingerprint --lt-cred-mech
      --realm=your-domain.example --user=turnuser:CHANGE_THIS_LONG_PASSWORD
      --min-port=49160 --max-port=49200 --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
